# tickets.toml — épicos da iniciativa, na ordem de construção.

[[epic]]
id = 1
slug = "epic-fundacao"
title = "Fundação técnica do DEZI novo"
covers = []

[[epic]]
id = 2
slug = "epic-auditoria"
title = "Trilha de auditoria imutável"
covers = []
after = [{ epic = 1, needs = "RLS, papéis de banco e `ContextoDeEmpresa`" }]

[[epic]]
id = 3
slug = "epic-acesso"
title = "Acesso, sessão e perfis"
covers = ["CAP-1"]
after = [{ epic = 2, needs = "porta `RegistroDeAuditoria`" }]

[[epic]]
id = 4
slug = "epic-cadastro"
title = "Cadastro organizacional"
covers = ["CAP-2"]
after = [{ epic = 3, needs = "portas `ResolucaoDeEmpresa`, `EscopoOrganizacional` e `criarCredencial`" }]

[[epic]]
id = 5
slug = "epic-comunicacao"
title = "Comunicação e e-mail"
covers = ["CAP-10"]
after = [{ epic = 4, needs = "destinatário e preferências lidos de `cadastro`" }]

[[epic]]
id = 6
slug = "epic-catalogo"
title = "Catálogo de competências e escalas"
covers = ["CAP-3", "CAP-4"]
after = [{ epic = 4, needs = "cargo e escopo de `cadastro`" }]

[[epic]]
id = 7
slug = "epic-avaliacao"
title = "Ciclo de vida da avaliação"
covers = ["CAP-5"]
after = [{ epic = 5, needs = "aviso de liberação e erro" }, { epic = 6, needs = "versão do catálogo e aplicabilidade" }]

[[epic]]
id = 8
slug = "epic-preenchimento"
title = "Preenchimento das etapas"
covers = ["CAP-6"]
after = [{ epic = 7, needs = "snapshot, participantes e portas `PreparacaoDeRespostas` e `RespostasDoParticipante`" }]

[[epic]]
id = 9
slug = "epic-resultados"
title = "Resultados e acompanhamento"
covers = ["CAP-7"]
after = [{ epic = 8, needs = "completude e `Igualdade(Av1, Av2)`" }]

[[epic]]
id = 10
slug = "epic-pdi"
title = "PDI, apontamento e feedforward"
covers = ["CAP-8", "CAP-9"]
after = [{ epic = 7, needs = "avaliação e coordenada congelada para vínculo" }]

[[epic]]
id = 11
slug = "epic-lgpd-titular"
title = "Direitos do titular e LGPD"
covers = []
after = [{ epic = 5, needs = "tratador de `comunicacao`" }, { epic = 8, needs = "tratador de `preenchimento`" }, { epic = 9, needs = "tratador de `resultados`" }, { epic = 10, needs = "tratador de `pdi`" }]

