<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
		xmlns:th="http://www.thymeleaf.org" 
	    xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
	    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<title>DEZI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body
	style="color: rgb(55, 71, 79); font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 18px; text-align: justify;">
	<table align="center" border="0" cellpadding="0" cellspacing="0"
		width="800">
		<tr>
			<td align="center" bgcolor="#9EB44D" style="padding: 40px 0 30px 0;">
			</td>
		</tr>
		<tr>
			<td bgcolor="#ffffff" style="padding: 40px 30px 40px 30px;">
				<div style="margin: 0 auto;">
					<h3 style="font-size: 20px; font-weight: bold;">Prezado Suporte,</h3>
					<p>
						Foi solicitado uma ajuda, por <span th:text="${nomeremetente}"></span>, com e-mail
						<span th:text="${emailremetente}"></span>, através do aplicativo Dezi. <br>
						<br> Segue abaixo os detalhes da demanda: <br>
						<br> <strong>Plataforma do Aplicativo: </strong><span th:text="${plataforma}"></span><br>
						<br> <strong>Classificação: </strong><span th:text="${classificacao}"></span><br>
						<br> <strong>Mensagem: </strong><span th:text="${mensagem}"></span><br>
						<br>Atenciosamente, <br> <strong>A App Dezi.</strong>
					</p>
				</div>
			</td>
		</tr>
		<tr>
			<td align="center" bgcolor="#9EB44D" style="padding: 40px 0 30px 0;">
			</td>
		</tr>
	</table>
</body>
</html>
