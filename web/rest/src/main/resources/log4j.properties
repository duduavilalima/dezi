log4j.appender.STDOUT=org.apache.log4j.ConsoleAppender
log4j.appender.STDOUT.layout=org.apache.log4j.PatternLayout
log4j.appender.STDOUT.layout.conversionPattern=%-5p - %-26.26c{1} - %m%n

log4j.appender.SYSLOG=org.apache.log4j.net.SyslogAppender
log4j.appender.SYSLOG.SyslogHost=localhost
log4j.appender.SYSLOG.Facility=LOCAL0
log4j.appender.SYSLOG.layout=org.apache.log4j.PatternLayout
log4j.appender.SYSLOG.layout.conversionPattern=%d{ISO8601} %-5p [%t] %c{2} %x - %m%n

log4j.appender.FILE = org.apache.log4j.rolling.RollingFileAppender
log4j.appender.FILE.rollingPolicy = org.apache.log4j.rolling.TimeBasedRollingPolicy
log4j.appender.FILE.rollingPolicy.ActiveFileName = ${log.dir}/dezi.log
log4j.appender.FILE.rollingPolicy.FileNamePattern = ${log.dir}/dezi.%d{yyyyMMdd}.log.gz
log4j.appender.FILE.layout=org.apache.log4j.PatternLayout
log4j.appender.FILE.layout.conversionPattern=%d{ISO8601} %-5p [%t] %c %x - %m%n

log4j.rootLogger=${log.level},${log.appender}

log4j.logger.org.hibernate=${log.level.hibernate}
log4j.logger.org.springframework=${log.level.spring}
