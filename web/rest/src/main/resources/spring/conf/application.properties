# Hibernate
environment.mode=${ENVIRONMENT:development}
environment.name=${ENVIRONMENT_NAME:development}
hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
hibernate.format_sql=false
hibernate.hbm2ddl.auto=none
hibernate.ejb.naming_strategy=org.hibernate.cfg.ImprovedNamingStrategy
hibernate.show_sql=false

# RabbitMQ Server
spring.rabbitmq.host=${DEZI_QUEUE_HOST:localhost}
spring.rabbitmq.port=${DEZI_QUEUE_PORT:5672}
spring.rabbitmq.username=${DEZI_QUEUE_USERNAME:admin}
spring.rabbitmq.password=${DEZI_QUEUE_PASSWORD:admin}

# RabbitMQ Queues
dezi.exchange.name=dezi-exchange
dezi.queue.name=dezi-queue
dezi.routing.key=dezi-routing-key

