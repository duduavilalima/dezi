db-dump-staging-hotfix-prerelease-hotfix:
  extends: .only-staging-hotfix-prerelease-hotfix-base
  <<: *db-dump-base

db-dump-staging-hotfix-unstable:
  extends: .only-staging-hotfix-unstable-base
  <<: *db-dump-base

db-dump-staging-stable:
  extends: .only-staging-stable-base
  <<: *db-dump-base

db-dump-staging-prerelease:
  extends: .only-staging-prerelease-base
  <<: *db-dump-base

db-dump-staging-unstable:
  extends: .only-staging-unstable-base
  <<: *db-dump-base
