version: '3.4'

services:
  web:
    image: docker.fasolti.com.br/dezi-web:${DEZI_VERSION_WEB}
    restart: unless-stopped
    environment:
      - ENVIRONMENT
      - ENVIRONMENT_NAME
      - NODE_ENV=${ENVIRONMENT}
    volumes:
      - weblogs:/var/log
      - "/etc/timezone:/etc/timezone:ro"
      - "/etc/localtime:/etc/localtime:ro"

volumes:
  weblogs:
