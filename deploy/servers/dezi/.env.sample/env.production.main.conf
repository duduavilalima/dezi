#
# PRODUCTION:MAIN
#

# Arquivos de configuração para ambientes de produção:
# As configurações padrão são:
# - Banco de dados externo
# - Proxy externo
# - Servidor RabbitMQ interno
#
COMPOSE_FILE=docker-compose.proxyext.yml:docker-compose.dbext.yml:docker-compose.mqint.yml:docker-compose.biext.yml:docker-compose.web.yml:docker-compose.rest.yml:docker-compose.queue.yml:docker-compose.mobile.yml

# Versão das imagens do dezi
#
DEZI_VERSION_SERVICES=production
DEZI_VERSION_WEB=production
DEZI_VERSION_QUEUE=production
DEZI_VERSION_MOBILE=production

# Nome da rede externa do proxy
# Mudar este nome se o nome do projeto Compose referente ao proxy também mudar!
#
DEZI_PROXY_NETWORK_NAME=deziproxy_default

# Configurações de Banco de dados (padrão)
#
DB_ADMIN_USER=postgres
DB_ADMIN_PASS=postgres
DB_HOST=db
DB_PORT=5432
DB_NAME=avd
DB_USER=deziuser
DB_PASS=deziuser
DB_DUMP_HOST=10.0.0.5
EXT_DB_HOST=10.0.0.5
EXT_DB_PORT=5432
EXT_DB_NAME=avd
EXT_DB_USER=deziuser
EXT_DB_PASS=deziuser

# Porta para a qual o serviço de BD será disponibilizado no host (i.e. via --publish)
DB_HOST_PORT=5432

# É necessário mudar DUMP_DB_HOST para algum IP do host acessível por um container
# (e.g. IP da interface docker0).
# DUMP_DB_PORT deve ser igual a HOST_DB_PORT
DB_DUMP_HOST=localhost
DB_DUMP_PORT=5432
