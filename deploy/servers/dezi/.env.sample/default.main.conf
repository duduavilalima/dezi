#
# DEFAULT:MAIN
#

# Arquivos de configuração para ambientes de produção:
# As configurações padrão são:
# - Banco de dados externo
# - Proxy externo
# - Servidor RabbitMQ interno
COMPOSE_FILE=docker-compose.proxyint.yml:docker-compose.dbint.yml:docker-compose.mqint.yml:docker-compose.biext.yml:docker-compose.web.yml:docker-compose.rest.yml:docker-compose.queue.yml:docker-compose.mobile.yml

# Versão das imagens do dezi
#
DEZI_VERSION_SERVICES=staging
DEZI_VERSION_WEB=staging
DEZI_VERSION_QUEUE=staging
DEZI_VERSION_MOBILE=staging

# Configurações de Banco de dados
#
DB_ADMIN_USER=postgres
DB_ADMIN_PASS=postgres
DB_HOST=db
DB_PORT=5432
DB_NAME=dezi-hom
DB_USER=deziuser
DB_PASS=deziuser
EXT_DB_HOST=db
EXT_DB_PORT=5001
EXT_DB_NAME=dezi-hom
EXT_DB_USER=deziuser
EXT_DB_PASS=deziuser

# Porta para a qual o serviço de BD será disponibilizado no host (i.e. via --publish)
DB_HOST_PORT=5432

# É necessário mudar DUMP_DB_HOST para algum IP do host acessível por um container
# (e.g. IP da interface docker0).
# DUMP_DB_PORT deve ser igual a HOST_DB_PORT
DB_DUMP_HOST=localhost
DB_DUMP_PORT=5432
