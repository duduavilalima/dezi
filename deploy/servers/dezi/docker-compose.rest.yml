version: '3.4'

services:
  rest:
    image: docker.fasolti.com.br/dezi-services:${DEZI_VERSION_SERVICES}
    restart: unless-stopped
    environment:
      - ENVIRONMENT
      - ENVIRONMENT_NAME
    volumes:
      - restlogs:/var/log
      - resttomcatlogs:/usr/local/tomcat/logs
      - "/etc/timezone:/etc/timezone:ro"
      - "/etc/localtime:/etc/localtime:ro"
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "10"

volumes:
  restlogs:
  resttomcatlogs:

