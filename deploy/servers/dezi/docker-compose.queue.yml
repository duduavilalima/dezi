version: '3.4'

services:
  queue:
    image: docker.fasolti.com.br/dezi-queue:${DEZI_VERSION_QUEUE}
    restart: unless-stopped
    volumes:
      - queuelogs:/var/log
      - "/etc/timezone:/etc/timezone:ro"
      - "/etc/localtime:/etc/localtime:ro"
    environment:
      - ENVIRONMENT
      - ENVIRONMENT_NAME
      - DEZI_SMTP_HOST=$MAIL_HOST
      - DEZI_SMTP_USERNAME=$MAIL_USER
      - DEZI_SMTP_PASSWORD=$MAIL_PASS
      - DEZI_EMAIL_FROM=$MAIL_FROM
      - >-
        JAVA_OPTS=-Djava.awt.headless=true
        -Dspring.profiles.active=${ENVIRONMENT}
        ${JAVA_EXTRA_OPTS}
    logging:
      driver: "json-file"
      options:
        max-size: "2m"
        max-file: "10"

volumes:
  queuelogs:
