spring.profiles.active=dev
server.port = 8090
logging.level.org.springframework=info

# undertow
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
server.undertow.accesslog.enabled=false
server.undertow.accesslog.dir=logs
server.undertow.accesslog.pattern=%t %a "%r" %s (%D ms)
server.compression.enabled=true
server.compression.min-response-size=1

# SQL
spring.jpa.database=default
spring.jpa.generate-ddl=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.type=info
#spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQL9Dialect
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
#spring.datasource.url=jdbc:postgresql://localhost:5432/dezi-dev
#spring.datasource.username=deziuser
#spring.datasource.password=deziuser

spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=50

spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

#spring.datasource.url=jdbc:postgresql://localhost:5445/dezi-hom
spring.datasource.url=jdbc:postgresql://localhost:5432/avd
spring.datasource.username=deziuser
spring.datasource.password=deziuser


# Empresa
dezi.empresa.name=mentorapp
dezi.createdby.name=admin

# Dimensao
default.dimensao.nome=Aplicação
default.dimensao.id=100

#Planilha Cadastro Funcionário
funcionario.import=ImportFuncionais.xlsx

#Planilha Cadastro Competência
comp.import=ImportCompetencias.xlsx

#Planilha Cadastro Associações
associacoes.import=ImportCargos.xlsx