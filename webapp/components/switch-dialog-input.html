<md-input-container fill-width ng-form="{{ $ctrl.name }}">
	<md-switch
		ng-model="$ctrl.value"
		aria-label="Botão situação"
		ng-change="$ctrl.handleChange($ctrl.value)"
		ng-disabled="!!$ctrl.options.disabled"
		>
		{{'SITUACAO.' + $ctrl.situacao | translate }}
	</md-switch>
</md-input-container>
