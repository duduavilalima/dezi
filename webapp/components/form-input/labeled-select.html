<md-input-container
	fill-width
	ng-form="{{ $ctrl.name }}"
	ng-keyup="$ctrl._onReset($event)"
>
	<label for="input">
		<span translate ng-if="$ctrl.translateLabel">{{ $ctrl.label }}</span>
		<span ng-if="!$ctrl.translateLabel">{{ $ctrl.label }}</span>
	</label>

	<md-select
		name="input"
		ng-model="$ctrl.value"
		ng-model-options="$ctrl.modelOptions"
		ng-change="$ctrl._onChange($ctrl.value)"
		ng-disabled="$ctrl.readOnly"
		ng-required="$ctrl.required"
		md-on-close="$ctrl._onCloseSelectSearch()"
	>
		<md-select-header ng-if="$ctrl.searchable" ng-keydown="$ctrl._onSearchEventPropagation($event)">
			<!-- TODO Adicionar tradução padrão para o placeholder -->
			<!-- (i.e. substituir o 'Pesquisar...' por uma tradução) -->
			<input
				name="searchTerm"
				type="search"
				ng-value="$ctrl.searchTerm"
				ng-keyup="$ctrl._onFilterChange($event)"
				placeholder="{{
					$ctrl.options.placeholder ? $ctrl.options.placeholder
					: $ctrl.options.trPlaceholder ? ($ctrl.options.trPlaceholder | translate)
					: 'Pesquisar...'
				}}"
			>
		</md-select-header>

		<md-option
			ng-if="!$ctrl.searchable && ($ctrl.nullable || $ctrl.value === undefined || $ctrl.value === null)"
			ng-value="undefined"
			ng-disabled="!$ctrl.nullable"
			md-option-empty="true"
		>
			<!-- TODO Traduzir -->
			Selecione...
		</md-option>
		<md-option
			ng-repeat="
				option in $ctrl.list
				| orderBy: $ctrl.orderBy
				| filter: $ctrl._createSearchFilter($ctrl.searchTerm)"
			ng-value="option"
			ng-model-options="$ctrl.modelOptions"
		>
			<span ng-if="!$ctrl.translate">
				{{:: option[$ctrl.optionLabelKey] }}
			</span>
			<span ng-if="$ctrl.translate">
				{{:: option[$ctrl.optionLabelKey] | translate }}
			</span>
		</md-option>
	</md-select>

	<div ng-messages="$ctrl._getFormErrors()">
		<div ng-repeat="(message, value) in $ctrl.messages" ng-message="{{:: message }}">
			<span translate translate-values="$ctrl.translateValues">{{ value }}</span>
		</div>
	</div>
</md-input-container>
