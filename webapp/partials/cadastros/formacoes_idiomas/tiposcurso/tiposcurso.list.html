<div id="graduacoes" class="page-layout simple fullwidth doc-page">
	<div flex-xs flex-gt-xs="100" layout="column" class="p-8">
		<div class="white-bg style_card m-8">
			<md-table-container class="table_pesquisa">
				<table id="table-list" md-table md-progress="promise">
					<thead fix-head md-head md-order="$ctrl.tableConf.order">
					<tr md-row class="grey-200-bg">
						<th md-column md-order-by="nome" width="70%">
							<span translate>TIPOS.TIPODECURSO</span>
						</th>
						<th md-column width="10%">
							<span translate>TIPOS.REQUER</span>
						</th>
						<th md-column width="10%">
							<span translate>TIPOS.REQUEROUTRO</span>
						</th>
						<th md-column md-order-by="situacao" width="10%">
							<span translate>TIPOS.SITUACAO</span>
						</th>
					</tr>
					</thead>
					<tbody md-body>
					<tr md-row ng-repeat="item in $ctrl.listCursos | tiposcursoFilter: listFilter | orderBy: $ctrl.tableConf.order | limitTo: tableControl.limit : ($ctrl.tableConf.page -1) * tableControl.limit" class="text-left">
						<td md-cell><a class="link-table-search" href ng-click="$ctrl.displayView(item)">{{ ::item.nome }}</a></td>
						<td md-cell><span ng-class="{'green-bg': item.preencheGraduacao == true, 'red-bg' : item.preencheGraduacao != true}" class="estilo_situacao"><b>{{ item.preencheGraduacao ? 'Sim' : 'Não' }}</b></span></td>
						<td md-cell><span ng-class="{'green-bg': item.preencheEspecializacao == true, 'red-bg' : item.preencheEspecializacao != true}" class="estilo_situacao"><b>{{ ::item.preencheEspecializacao ? 'Sim' : 'Não' }}</b></span></td>
						<td md-cell><span ng-class="{'green-bg ml-5': item.situacao == 'ATIVA', 'red-bg' : item.situacao != 'ATIVA'}" class="estilo_situacao"><b>{{ 'SITUACAO.' + item.situacao | translate }}</b></span></td>
					</tr>
					</tbody>
				</table>
			</md-table-container>
			<md-table-pagination
				md-limit="$ctrl.tableConf.limit"
				md-limit-options="tableControl.limit_options"
				md-page="$ctrl.tableConf.page"
				md-total="{{ ($ctrl.listCursos| tiposcursoFilter: listFilter).length }}"
				md-page-select
				md-label="{{ 'FUNCIONARIO.LBLPAGINA' | translate }}"
			/>
		</div>
	</div>

</div>
