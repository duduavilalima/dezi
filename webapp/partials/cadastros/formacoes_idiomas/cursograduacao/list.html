<div id="graduacoes" class="page-layout simple fullwidth doc-page">

	<!-- HEADER -->
	<div class="header md-accent-bg header_fixo" layout="row" layout-align="space-between">
		<div layout="column" layout-align="center start">
			<div layout="column" layout-align="center start">
				<div class="breadcrumb" layout="row" layout-align="start center">
					<span hide show-gt-sm class="parent">Cadastros</span>
					<md-icon hide show-gt-sm md-font-icon="icon-chevron-right" class="s16 separator"></md-icon>
					<span hide show-gt-xs class="parent">Formação e Idiomas</span>
					<md-icon hide show-gt-xs md-font-icon="icon-chevron-right" class="s16 separator"></md-icon>
					<span class="parent">Cursos de graduação</span>
				</div>
			</div>
		</div>
		<div layout-align="end center" layout="row" class="margin-input">

			<!-- INPUT SEARCH -->
			<div hide show-gt-xs id="filter_list" class="breadcrumb filter-list">
				<label id="lbl_search" class="label-filter-list" translate>GRADUACAO.PESQUISAR</label>
				<input id="input_search" type="text" name="input_search" ng-model="filtro" class="input-filter-list">
			</div>

			<md-button
				hide-xs
				id="btn_novo"
				type="button"
				translate="GRADUACAO.BTNNOVO"
				style="text-transform: inherit;"
				class="font-size-13 md-raised md-accent m-0 mr-5 text-capitalize"
				aria-label="Criar"
				ng-if="$ctrl.canEdit"
				ng-click="$ctrl.displayNew()"
				/>
			<md-button
				hide
				show-xs
				type="button"
				class="md-fab md-mini md-accent"
				aria-label="Criar"
				ng-click="$ctrl.displayNew()"
			>
				<md-icon md-font-icon="icon-plus" hide show-xs />
			</md-button>
		</div>
	</div>


	<div flex-xs flex-gt-xs="100" layout="column" class="p-8 mt-50">
		<div class="white-bg style_card m-8">
			<md-table-container class="table_pesquisa">
				<table id="table-list" md-table md-progress="promise">
					<thead fix-head md-head md-order="$ctrl.tableConf.order">
					<tr md-row class="grey-200-bg">
						<th md-column md-order-by="nome" width="60%">
							<span translate>GRADUACAO.GRADU</span>
						</th>
						<th md-column width="30%">
							<span translate>GRADUACAO.REQUER</span>
						</th>
						<th md-column md-order-by="situacao" width="10%">
							<span translate>GRADUACAO.SITUACAO</span>
						</th>
					</tr>
					</thead>
					<tbody md-body>
					<tr md-row ng-repeat="item in $ctrl.listCursos | cursosgraduacaoFilter: filtro | orderBy: $ctrl.tableConf.order | limitTo: tableControl.limit : ($ctrl.tableConf.page -1) * tableControl.limit" class="text-left">
						<td md-cell><a class="link-table-search" href ng-click="$ctrl.displayView(item)">{{ ::item.nome }}</a></td>
						<td md-cell><span ng-class="{ 'green-bg': item.preencheOutrosCursos == true, 'red-bg' : item.preencheOutrosCursos != true }" class="estilo_situacao"><b>{{ ::item.preencheOutrosCursos ? 'Sim' : 'Não' }}</b></span></td>
						<td md-cell><span ng-class="{ 'green-bg ml-5': item.situacao == 'ATIVA', 'red-bg' : item.situacao != 'ATIVA' }" class="estilo_situacao"><b>{{'SITUACAO.' +item.situacao | translate }}</b></span></td>
					</tr>
					</tbody>
				</table>
			</md-table-container>
			<md-table-pagination
				md-limit="$ctrl.tableConf.limit"
				md-limit-options="tableControl.limit_options"
				md-page="$ctrl.tableConf.page"
				md-total="{{ ($ctrl.listCursos| cursosgraduacaoFilter: filtro).length }}"
				md-page-select
				md-label="{{ 'FUNCIONARIO.LBLPAGINA' | translate }}"
			/>
		</div>
	</div>

</div>
