<div flex-xs flex-gt-xs="100" layout="column" class="p-16">
    <div class="white-bg style_card mt-5 ml-10 mr-10">
        <md-table-container>
            <table id="table-list-recebidas-msg" md-table md-progress="promise">
                <thead md-head md-order="$ctrl.queryRecebidos.order">
                <tr md-row>
                    <th md-column md-order-by="titulo" width="45%">
                        <span>Título</span>
                    </th>
                    <th md-column ng-if="!avaliacaoEnvio" md-order-by="usuarioEnvio.nome" width="15%">
                        <span>De</span>
                    </th>
                    <th md-column ng-if="avaliacaoEnvio" md-order-by="avaliacaoEnvio.descricaoAbreviada" width="15%">
                        <span>De</span>
                    </th>
                    <th md-column md-order-by="dataHoraEnvio" width="10%">
                        <span>Data Recebimento</span>
                    </th>
                    <th md-column md-order-by="dataHoraAbertura" width="10%">
                        <span>Data Leitura</span>
                    </th>
                </tr>
                </thead>

                <tbody md-body ng-if="$ctrl.listDestinos == null || $ctrl.listDestinos.length == 0">
                <td md-cell colspan="4"><div class="text-center p-16">Não há mensagens recebidas.</div></td>
                </tbody>

                <tbody md-body ng-if="$ctrl.listDestinos != null && $ctrl.listDestinos.length > 0">
                <tr md-row ng-repeat="item in $ctrl.listDestinos | orderBy: $ctrl.queryRecebidos.order | limitTo: tableControl.limit : ($ctrl.queryRecebidos.page -1) * tableControl.limit" class="text-left">
                    <td md-cell ng-class="{'md-body-2' : item.isNew}">
                        <md-icon ng-if="item.mensagemOriginal != null" md-font-icon="icon-arrow-right" class="s16 separator"></md-icon>
                        <a class="" href ng-click="$ctrl.acaoExibirMensagemEnviada($event, $index, item)">{{ ::item.titulo }}</a>
                        <span ng-if="item.isNew" class="nova">nova</span>
                    </td>
                    <td md-cell ng-if="item.avaliacaoEnvio == null" ng-class="{'md-body-2' : item.isNew}">{{ ::item.usuarioEnvio.nome }}</td>
                    <td md-cell ng-if="item.avaliacaoEnvio != null" ng-class="{'md-body-2' : item.isNew}">{{ ::item.avaliacaoEnvio.descricaoAbreviada }}</td>
                    <td md-cell ng-class="{'md-body-2' : item.isNew}">{{ ::item.dataHoraEnvio | date: 'dd/MM/yyyy HH:mm' }}</td>
                    <td md-cell ng-class="{'md-body-2' : item.isNew}">{{ ::item.dataHoraAbertura | date: 'dd/MM/yyyy HH:mm' }}</td>

                </tbody>
            </table>
        </md-table-container>
        <md-table-pagination md-limit="tableControl.limit" md-limit-options="tableControl.limit_options" md-page="$ctrl.queryRecebidos.page" md-total="{{$ctrl.listDestinos.length}}" md-page-select
                             md-label="{page: 'Página:', rowsPerPage: 'Registros por página:', of: 'de'}"></md-table-pagination>
    </div>
</div>
