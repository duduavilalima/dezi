<md-dialog aria-label="Mensagem" style="width: 850px;">
	<form name="basicForm" novalidate>
		<md-toolbar class="cor_title white-fg">
			<div class="md-toolbar-tools">
				<h2>{{ title }}</h2>
				<span flex />
				<md-button class="md-icon-button" ng-click="cancel()" aria-label="Fechar" >
					<md-icon class="white-fg" md-font-icon="icon-close" />
				</md-button>
			</div>
		</md-toolbar>
		<md-dialog-content>
			<div class="md-content-body">

				<!-- WIDGET GROUP -->
				<div class="widget-group" layout="row" flex="100" layout-wrap>

					<ms-widget flippable="false" layout="row" flex="100">

						<ms-widget-front class="p-16 white-bg" flex="100">
							<div layout="row" ng-if="object.isDestino">
								<md-input-container flex="100">
									<label id="lbl_de" for="de">De</label>
									<input ng-if="object.avaliacaoEnvio == null" id="de" name="de" type="text" ng-model="object.usuarioEnvio.nome" ng-disabled="true">
									<input ng-if="object.avaliacaoEnvio != null" id="de" name="de" type="text" ng-model="object.avaliacaoEnvio.descricaoAbreviada" ng-disabled="true">
								</md-input-container>
							</div>

							<div layout="row" ng-if="object.isEnvio">
								<md-input-container flex="100">
									<label id="lbl_para" for="de">Para</label>
									<input id="para" name="para" type="text" ng-model="object.usuarioDestino.nome" ng-disabled="true">
								</md-input-container>
							</div>

							<div layout="row"">
								<md-input-container flex="100">
									<label id="lbl_assunto" for="assunto">Título</label>
									<input id="assunto" name="assunto" type="text" ng-model="object.titulo" ng-disabled="true">
								</md-input-container>
							</div>

							<div flex="100" style="margin-top: -32px;">
								<div id="title_participantes_msg_anterior" ng-if="object.mensagemOriginal != null" flex class="md-accent-fg"><h1>Mensagem anterior</h1></div>

								<div ta-bind="text" class="p-8" ng-if="object.mensagemOriginal != null" style="border: 1px solid rgba(0,0,0,0.40);" ng-model="object.mensagemOriginal.texto"></div>

								<div id="title_participantes_msg" flex class="md-accent-fg"><h1>Mensagem</h1></div>

								<div ta-bind="text" class="p-8" style="border: 1px solid rgba(0,0,0,0.40);" ng-model="object.texto"></div>
							</div>

						</ms-widget-front>

					</ms-widget>

				</div>
			</div>
		</md-dialog-content>


		<md-dialog-actions layout="row" class="white-bg" ng-if="object.isDestino">
			<div layout-align="start center" ng-if="object.isDestino">
				<md-button aria-label="fechar" style="float: left" class="md-raised md-default text-capitalize"ng-click="cancel()">Fechar</md-button>
			</div>

			<div layout-align="end center" ng-if="object.isDestino">
				<md-button aria-label="responder" style="float: right" class="md-raised md-accent text-capitalize" ng-click="responder_exibicao($event)">Responder</md-button>
			</div>

		</md-dialog-actions>

		<md-dialog-actions layout="row" layout-align="center center" class="white-bg" ng-if="!object.isDestino">
			<md-button aria-label="fechar" class="md-raised md-default text-capitalize" ng-click="confirmar()">Fechar
			</md-button>
		</md-dialog-actions>

	</form>
</md-dialog>
