<div id="forgot-password" class="flex-scrollable" style="margin:auto;" layout="column" ms-scroll>
    <div id="forgot-password-form-wrapper" layout="column" layout-align="center center">
        <div id="forgot-password-form" class="md-whiteframe-8dp">
            <!--<div class="logo md-accent-bg">-->
                <!--<span>AD</span>-->
            <!--</div>-->

			<div>
				<img src="img/logos/logo-dezi.png">
			</div>

            <div class="title"><span translate="ESQUECEUSENHA.REDEFINA">Redefina sua senha</span></div>

			<div class="md-accent-color"><span translate="ESQUECEUSENHA.ENVIADO">Informe seu e-mail para redefinição de senha</span></div>

            <form name="forgotPasswordForm" novalidate>

				<md-input-container class="md-block" style="margin-top: 50px; margin-bottom: 40px">
					<label id="lbl_input_email" for="input_email"><span translate="ESQUECEUSENHA.ENDERECO">Informe seu E-mail</span></label>
					<input type="email" id="input_email" name="emailFuncional" class="text-lowercase" ng-model="$ctrl.user.emailFuncional" required ng-required="true">
					<div ng-messages="forgotPasswordForm.emailFuncional.$error" role="alert" multiple>
						<div ng-message="email">
							<span translate="LOGIN.VALIDATION-EMAIL"></span>
						</div>
						<div ng-message="required">
							<span translate="LOGIN.VALIDATION">Obrigatório</span>
						</div>
						<div ng-message="emailCadastrado">
							<span>O e-mail informado não está cadastrado</span>
						</div>
					</div>
				</md-input-container>
                <md-button type="submit" class="md-raised md-accent submit-button" ng-click="$ctrl.forgotPassword()" aria-label="Redefinir senha"
                           ng-disabled="forgotPasswordForm.$invalid || forgotPasswordForm.$pristine" translate translate-attr-aria-label="ESQUECEUSENHA.BTNREDEFINA"
						   style="width: 100%;margin-top: 60px"><span translate="ESQUECEUSENHA.BTNREDEFINA">Redefinir senha</span></md-button>
            </form>

            <div class="login" layout="row" layout-align="center center">
                <a class="link" href ng-click="$ctrl.back()"><span translate="ESQUECEUSENHA.BTNVOLTAR">Voltar para a tela de login</span></a>
            </div>
        </div>
    </div>
</div>
