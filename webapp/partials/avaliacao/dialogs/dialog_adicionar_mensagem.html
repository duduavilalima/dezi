<md-dialog aria-label="Mensagem" style="width: 1160px;">
	<form name="basicForm" novalidate>
		<md-toolbar>
			<div class="md-toolbar-tools">
				<h2>{{ title }}</h2>
				<span flex></span>
				<md-button id="bt_fechar_popup_confirmacao_confirmar" class="md-icon-button" ng-click="cancel()"
						   style="padding: 0px 0px 0px 0px;">
					<md-icon style="color: rgba(255,255,255,0.87) !important" md-font-icon="icon-close"
							 aria-label="Close dialog"></md-icon>
				</md-button>
			</div>
		</md-toolbar>
		<md-dialog-content style="padding: 0px 0px 0px 0px;padding: 0px;" ng-show="object != null">
			<div class="md-dialog-content"
				 style="padding: 0px 0px 0px 0px;padding: 0px;background-color: rgb(245,245,245);">

				<!-- WIDGET GROUP -->
				<div class="widget-group" layout="row" flex="100" layout-wrap>

					<!-- WIDGET 7 -->
					<ms-widget flippable="false" layout="row" flex="100" flex-gt-md="100">

						<!-- Front -->
						<ms-widget-front class="white-bg">

							<div id="title_participantes" flex class="md-accent-fg" style="margin-left: 20px;"><h1>Destinatários</h1></div>

							<div class="ph-16 pv-16 border-bottom" layout="row" layout-align="space-between center" style="margin-top: -20px;">

								<md-input-container flex="100">
									<label id="lbl_filtro" for="filtro">Filtro</label>
									<input id="filtro" name="filtro" type="text" ng-model="filtro">
								</md-input-container>

							</div>

							<div style="margin-top: -40px;height: 260px;overflow-y: auto;">

								<md-table-container>
									<table id="table-analise" class="simple dataTable row-border  hover text-center"
										   ms-responsive-table>
										<thead>
											<tr class="grey-300-bg">
												<th class="secondary-text" width="10%">
													<div class="table-header text-left">
														<md-checkbox style="margin-bottom: -20px;" ng-click="selectedAll()" ng-model="object.checkAll" class="font-size-5" aria-label="Checkbox tabela"></md-checkbox>
													</div>
												</th>
												<th class="secondary-text" width="45%">
													<div class="table-header text-left"><span class="column-title">Nome</span></div>
												</th>
												<th class="secondary-text" width="15%">
													<div class="table-header text-left"><span class="column-title">Cargo</span>
													</div>
												</th>
												<th class="secondary-text" width="15%" hide-xs>
													<div class="table-header text-left"><span
														class="column-title">Departamento</span></div>
												</th>
												<th class="secondary-text" width="15%">
													<div class="table-header text-center"><span class="column-title">Notificar via e-mail</span>
														<md-checkbox style="margin-bottom: -20px;" ng-model="object.checkAllEmail" ng-click="selectedAllEmail()" class="font-size-14" aria-label="Checkbox email"></md-checkbox>
													</div>
												</th>
											</tr>
										</thead>

										<tbody ng-if="listAnalise == null">
											<tr align="center">
												<td></td>
												<td></td>
												<td>
													<div layout="column" layout-align="center center" ng-show="listAnalise == null">
														<md-progress-circular md-mode="indeterminate"></md-progress-circular>
													</div>
												</td>
												<td></td>
												<td></td>
											</tr>
										</tbody>

										<tbody ng-if="listAnalise != null">
											<tr ng-repeat="item in listAnalise | MessageFilter: filtro | orderBy: 'avaliador.nome'" class="text-left">
												<td style="padding-bottom: 0px; padding-top: 0px;">
													<md-checkbox style="margin-bottom: -20px;" ng-model="item.check" ng-change="verificarItensSelecionadosParticipantes()" class="font-size-14" aria-label="Checkbox tabela"></md-checkbox>
												</td>
												<td>{{ ::item.avaliado.nome}}</td>
												<td>{{ ::item.avaliado.cargo.nome }}</td>
												<td hide-xs>{{ ::item.avaliado.departamento.nome }}</td>
												<td style="padding-bottom: 0px; padding-top: 0px;">
													<div class="text-center">
														<md-checkbox style="margin-bottom: -20px;" ng-model="item.checkEmail" ng-change="verificarItensSelecionadosEmail()" class="font-size-14" aria-label="Checkbox email"></md-checkbox>
													</div>
												</td>
											</tr>
										</tbody>
									</table>
								</md-table-container>
							</div>
						</ms-widget-front>
						<!-- / Front -->

					</ms-widget>
					<!-- / WIDGET 7 -->

					<ms-widget flippable="false" layout="row" flex="100">

						<!-- Front -->
						<ms-widget-front class="p-16 white-bg">

							<md-input-container flex="100">
								<label id="lbl_assunto" for="assunto">Título</label>
								<input id="assunto" name="assunto" type="text" ng-model="object.titulo" ng-required="true" ng-maxlength="255" md-maxlength="255" max="255">
								<div ng-messages="basicForm.assunto.$error" ng-show="basicForm.assunto.$touched">
									<div ng-message="required">
										<span>Campo obrigatório.</span>
									</div>
									<div ng-message="maxlength">
										<span>Máximo de 255 caracteres.</span>
									</div>
								</div>
							</md-input-container>

							<text-angular style="color: black; border: 2px solid #9EB44D;" ng-model="object.texto"></text-angular>

						</ms-widget-front>
						<!-- / Front -->

					</ms-widget>

				</div>
			</div>
		</md-dialog-content>

		<md-dialog-actions layout="row" class="white-bg">
			<div flex layout-align="start center">
				<md-button aria-label="cancelar" style="float: left" class="md-raised md-default  text-capitalize" ng-click="cancel()">Cancelar</md-button>
			</div>
			<div flex layout-align="center center">
			</div>
			<div flex layout-align="end center">
				<md-button aria-label="confirmar" ng-disabled="basicForm.$invalid || peloMenosUmSelecionado()" style="float: right" class="md-raised md-primary text-capitalize"ng-click="confirmar()">Enviar</md-button>
			</div>
		</md-dialog-actions>
    </form>
</md-dialog>
