<div id="campanhas" class="page-layout simple fullwidth doc-page">
	<div class="header md-accent-bg" layout="row" layout-align="space-between">
		<div layout="column" layout-align="center start">
			<div class="title"><span>Mensagem Boas vindas</span></div>
		</div>
	</div>
	<div flex md-background-bg class="md-background-bg p-16">
		<form name="formMensagem">
			<br/>
			<div layout="row" layout-xs="column">

				<md-input-container flex="25" flex-xs="100">
					<label>Tipo de Mensagem</label>
					<md-select id="tipoDestinatario" name="tipoDestinatario"  ng-model="tipoDestinatario" ng-required="true" ng-change="limparSelecao()">
						<md-option ng-repeat="item in listaTipoDestinatario" ng-value="item.value">
							{{ item.label }}
						</md-option>
					</md-select>
				</md-input-container>

				<md-input-container flex="75" flex-xs="100" ng-if="tipoDestinatario === 'perfil'">
					<label>Perfil</label>
					<md-select id="perfil" name="perfil"  ng-model="object.perfil" ng-required="tipoDestinatario === 'perfil'">
						<md-option ng-repeat="item in perfis" ng-value="item">
							{{'PERFIL.' + item | translate}}
						</md-option>
					</md-select>
				</md-input-container>

				<md-autocomplete flex="75"
					flex-xs="100"
					ng-if="tipoDestinatario === 'colaborador'"
					ng-required="tipoDestinatario === 'colaborador'"
					id="autocomplete_colaborador"
					name="autocompleteColaborador"
					ng-model="selectedFilter.nome"
					md-input-name="autocompleteColaborador"
					md-selected-item="selectedFilter.nome"
					md-no-cache="false"
					md-selected-item-change="selectedItemColaboradorChange(item)"
					md-search-text-change="changeSearchTextColaborador(searchTextColaborador)"
					md-items="item in querySearchColaborador(searchTextColaborador)"
					md-search-text="searchTextColaborador"
					md-min-length="2"
					md-item-text="item.nome"
					md-floating-label="Colaborador"
					md-menu-class="autocomplete-custom-template"
					md-delay="250"
					md-input-id="input_colaborador"
				>
					<md-item-template style="height: 20px;">
						<span md-highlight-text="searchTextColaborador">{{item.nome}}</span>
					</md-item-template>

					<div
						ng-messages="basicForm.autocompleteColaborador.$error"
						ng-show="basicForm.autocompleteColaborador.$touched"
						role="alert"
					>
						<div ng-message="minlength" id="msg_min_colaborador">O nome informado não é suficiente.</div>
						<div ng-message="maxlength" id="msg_max_colaborador">O nome informado é muito longo.</div>
					</div>
				</md-autocomplete>

			</div>

			<div layout="row" layout-xs="column">

				<md-input-container flex="100" flex-xs="100">
					<label>Assunto</label>
					<input id="assunto" type="text" name="assunto" ng-model="object.assunto" ng-required="true" required>
				</md-input-container>

			</div>

			<div id="title_mensagens" flex class="md-accent-fg">
				<h1>Mensagem</h1>
			</div>

			<text-angular style="color: black; border: 2px solid #9EB44D;" ng-model="object.mensagem"></text-angular>

			<md-divider class="mt-20"></md-divider>
			<div layout="row" layout-align="end center" flex>
				<md-button class="md-raised md-accent" style="text-transform: none;" ng-disabled="formMensagem.$invalid" aria-label="Enviar mensagem" ng-click="enviarMensagem()">
					Enviar mensagem
				</md-button>
			</div>
		</form>
	</div>
</div>
