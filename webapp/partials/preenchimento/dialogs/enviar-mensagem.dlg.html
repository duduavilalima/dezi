<md-dialog aria-label="Adicionar Participante" ng-cloak style="width: 750px; height: 500px">
	<md-toolbar style="{{color}}">
		<div class="md-toolbar-tools">
			<h2>{{ title }}</h2>
			<span flex></span>
			<md-button id="bt_fechar_popup_confirmacao_confirmar" class="md-icon-button" ng-click="cancel()" style="padding: 0px 0px 0px 0px;">
				<md-icon style="color: rgba(255,255,255,0.87) !important" md-font-icon="icon-close" aria-label="Close dialog"></md-icon>
			</md-button>
		</div>
	</md-toolbar>
	<md-dialog-content>
		<div class="md-dialog-content">
			<form ng-submit="$event.preventDefault()" style="margin-top: -30px;">
				<div layout="column" layout-gt-md="row" flex="100">

					<md-input-container flex="30">
						<label for="de">De:</label>
						<input id="de_origem" name="de_origem" type="text"  ng-model="object.deOrigem" ng-disabled="true">
					</md-input-container>


					<span class="width-20"></span>


					<md-input-container flex="30">
						<label for="para">Para:</label>
						<input id="de_destino" name="de_destino" type="text"  ng-model="object.deDestino" ng-disabled="true">
					</md-input-container>

				</div>


				<div layout="column" layout-gt-md="row" flex="100">

					<md-input-container flex="30" style="margin-top: -10px;">
						<label for="data">Data:</label>
						<input id="data" name="data" type="text"  value="{{object.data | date: 'dd/MM/yyyy'}} - Hora: {{object.data | date: 'HH:mm'}}" ng-disabled="true">
					</md-input-container>
				</div>

				<div layout="column" layout-gt-md="row" flex="100">

					<textarea rows="3" name="textarea1" class="textarea_preenchimento">
                      </textarea>
				</div>

			</form>
		</div>
	</md-dialog-content>
	<md-dialog-actions>

		<div flex layout-align="start center">

			<!--BOTÃO CANCELAR-->
			<md-button id="btn_cancelar_cancelar_nregistro" class="md-raised md-default text-capitalize" ng-click="cancel()">
				Cancelar
			</md-button>
		</div>

		<div layout-align="end center">

			<md-button aria-label="confirmar"  class="md-raised md-default  text-capitalize"  ng-click="confirmar()">Enviar</md-button>
		</div>
	</md-dialog-actions>
</md-dialog>
