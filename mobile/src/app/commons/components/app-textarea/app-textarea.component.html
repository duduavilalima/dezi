<ion-row [formGroup]="parentForm">
	<ion-col>
		<ion-item>
			<ion-label color="primary" floating>
				{{ isApontamento
				? ("app.components.textarea.apontamento.label" | translate)
				: ("app.components.textarea.feedforward.label" | translate)
			}}*
			</ion-label>
			<ion-textarea rows="1" name="text" [formControlName]="isApontamento? 'apontamento': 'feedforward'" required
				autosize>
			</ion-textarea>
		</ion-item>
	</ion-col>
</ion-row>
